name: SlotBot

on:
  schedule:
    # Normaler Run: täglich alle 15 Minuten 6–23 Uhr (UTC)
    - cron: "0,15,30,45 4-21 * * *"
    # Wochenbericht: Sonntags um 19 Uhr DE-Zeit (17 Uhr UTC)
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      weekly_summary:
        description: "Wochenbericht manuell senden?"
        required: false
        default: "false"

jobs:
  run-slotbot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Nötig um stats.json ins Repo zu schreiben

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: SlotBot ausführen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEEKLY_SUMMARY: ${{ github.event.schedule == '0 17 * * 0' && 'true' || inputs.weekly_summary || 'false' }}
        run: python slotbot.py

      - name: Stats speichern
        run: |
          git config user.name "SlotBot"
          git config user.email "slotbot@github-actions"
          git add stats.json
          git diff --staged --quiet || git commit -m "📊 Stats update"
          git push
